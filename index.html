
<!--The fix has three layers: a solid colour that always works, a CSS background for modern clients, and a VML rectangle drawn behind the content for Outlook.

What you're building:

A fallback colour, chosen before the image
The background attribute and the CSS background, because clients disagree on which to read
A v:rect and v:textbox pair so Outlook gets the image too
Headline styling that stays readable whether or not the photo loads-->



<!doctype html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rove &amp; Co.</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f4f6;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:24px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; margin:0 auto; background-color:#ffffff;">
          <tr>
            <td align="center" height="280" bgcolor="#1b1f24" background="https://picsum.photos/seed/rove-hero-bg/600/280" style="background-color:#1b1f24; background-image:url('https://picsum.photos/seed/rove-hero-bg/600/280'); background-size:cover; background-position:center; padding:48px 32px; text-align:center; font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif;">
              <!--[if gte mso 9]><v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:600px; height:280px;"><v:fill type="frame" src="https://picsum.photos/seed/rove-hero-bg/600/280" color="#1b1f24" /><v:textbox inset="0,0,0,0"><![endif]-->
              <h1 style="margin:0 0 12px; font-size:28px; line-height:1.25; color:#ffffff; text-shadow:0 1px 2px rgba(0,0,0,0.4);">Built for the long way round</h1>
              <p style="margin:0; font-size:15px; line-height:1.6; color:#e5e7eb;">The winter range lands on Thursday.</p>
              <!--[if gte mso 9]></v:textbox></v:rect><![endif]-->
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

<!--THE RETINA IMAGE TRICK
A retina image, served at double size and displayed at half
Alt text written for someone who will never see the photo
Width and height attributes that hold the layout together when images are blocked
A background colour so the blocked state looks intentional
The retina trick costs file size, so use it on hero and product images that people look at, not on every small decorative graphic. Email file size matters, and Gmail clips messages over roughly 102KB.

-->


<!doctype html>
